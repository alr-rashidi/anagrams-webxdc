<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>W.O.R.D</title>
  
  <link rel="stylesheet" href="style.css" />
  
  <!-- WebXDC API script -->
  <script src="webxdc.js"></script>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="title-badge" id="statusBadge"></div>
    <h1 id="appName"></h1>
    <p class="subtitle" id="subtitle"></p>
  </header>

  <!-- Game Over Modal Box (Displayed under header when game ends) -->
  <div id="gameOverModal" class="game-over-box" style="display: none;">
    <h2 id="winnerName" class="winner-name"></h2>
    <p id="gameOverReason" style="font-size: 0.95rem; color: var(--text-secondary); margin-bottom: 12px;"></p>
    <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 10px;">
      <button id="modalRestartBtn" class="btn"></button>
    </div>
    <!-- Possible Words Section -->
    <div id="gameOverPossibleWordsSection" style="margin-top: 16px; border-top: 1px dashed var(--border-color); padding-top: 12px; text-align: start;">
      <div id="gameOverPossibleWordsTitle" style="font-weight: 700; font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 8px;"></div>
      <div id="gameOverPossibleWordsList" style="display: flex; flex-wrap: wrap; gap: 6px; max-height: 180px; overflow-y: auto; padding: 4px;"></div>
    </div>
  </div>

  <!-- Launch Screen (First open / start game) -->
  <div id="launchScreen" class="card">
    <button id="startGameBtn" class="btn"></button>
  </div>

  <!-- Active Game Screen -->
  <div id="activeGameScreen" style="display: none;">
    
    <!-- Letter Tiles Section -->
    <div class="card letters-section">
      <!-- Waiting Lobby (shown when status === 'waiting') -->
      <div id="waitingLobbyCard" style="display: none; text-align: center; padding: 20px 10px;">
        <div id="lobbyIcon" style="font-size: 2.5rem; margin-bottom: 10px;">⏳</div>
        <h3 id="waitingLobbyTitle" style="font-size: 1.15rem; font-weight: 800; color: var(--text-primary); margin-bottom: 8px;"></h3>
        <p id="waitingLobbyDesc" style="font-size: 0.9rem; color: var(--text-secondary); line-height: 1.6; margin: 0;"></p>
        <div id="lobbyCountdownBox" style="display: none; margin-top: 15px;">
          <div id="lobbyCountdownNum" style="font-size: 3.5rem; font-weight: 900; color: var(--accent-color); font-family: system-ui, sans-serif; line-height: 1;">5</div>
          <p id="secondsToStartText" style="font-size: 0.85rem; font-weight: 700; color: var(--text-secondary); margin-top: 6px;"></p>
        </div>
      </div>

      <div id="gamePlayArea">
        <p id="lettersTitle" style="font-weight: 700; color: var(--text-secondary);"></p>
        <div id="letterTilesContainer" class="letters-container">
          <!-- 5 Letter Tiles injected dynamically -->
        </div>

        <!-- Live Input Character Validation Warning Area -->
        <div id="inputWarning" style="display: none; color: var(--error-color, #dc2626); font-size: 0.85rem; font-weight: 700; margin: 4px 0 8px 0; text-align: center;"></div>

        <!-- Input Group -->
        <div class="input-group">
          <input type="text" id="wordInput" class="word-input" placeholder="" autocomplete="off" autocorrect="off" spellcheck="false" />
          <button id="submitBtn" class="btn btn-small" style="width: auto;"></button>
        </div>

        <div class="input-actions">
          <button id="clearBtn" class="btn btn-secondary btn-small"></button>
          <button id="backspaceBtn" class="btn btn-secondary btn-small"></button>
        </div>

        <!-- Feedback Area -->
        <div id="feedbackMsg" class="feedback-msg"></div>

        <!-- Progress Bar -->
        <div class="progress-container">
          <div class="progress-header">
            <span id="progressLabel"></span>
            <span id="progressPct">0%</span>
          </div>
          <div class="progress-bar-bg">
            <div id="progressFill" class="progress-bar-fill"></div>
          </div>
          <p id="progressStats" style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 4px; text-align: center;"></p>
        </div>
      </div>
    </div>

    <!-- Scoreboard -->
    <div class="card">
      <h3 id="scoreboardTitle" style="font-size: 1.1rem; font-weight: 800; margin-bottom: 10px;"></h3>
      <div id="scoreboardList" class="scoreboard-list">
        <!-- Player rows injected dynamically -->
      </div>
    </div>

    <!-- Discovered Words -->
    <div class="card">
      <h3 id="foundWordsTitle" style="font-size: 1.1rem; font-weight: 800; margin-bottom: 8px;"></h3>
      <p id="noWordsText" style="font-size: 0.85rem; color: var(--text-secondary); text-align: center; margin: 12px 0;"></p>
      <div id="wordsGrid" class="words-grid">
        <!-- Word chips injected dynamically -->
      </div>
    </div>

    <!-- How to Play Accordion (Moved below Discovered Words) -->
    <details class="rules-accordion">
      <summary id="rulesTitle"></summary>
      <div class="rules-content">
        <p id="rule1"></p>
        <p id="rule2"></p>
        <p id="rule3"></p>
        <p id="rule4"></p>
        <p id="rule5"></p>
      </div>
    </details>

    <!-- Action Buttons -->
    <div style="display: flex; gap: 10px; margin-top: 14px;">
      <button id="claimHostBtn" class="btn btn-secondary" style="display: none;"></button>
      <button id="resignBtn" class="btn btn-danger btn-small"></button>
    </div>

  </div>

  <!-- Game History Controls -->
  <div style="margin-top: 20px; margin-bottom: 16px; text-align: center;">
    <button id="historyBtn" class="btn btn-secondary"></button>
  </div>

  <!-- Game History Modal / Container -->
  <div id="historyModal" class="card" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px;">
      <h3 id="historyTitle" style="font-size: 1.1rem; font-weight: 800;"></h3>
      <button id="closeHistoryBtn" class="btn btn-secondary btn-small" style="width: auto;"></button>
    </div>
    <div id="historyList">
      <!-- Injected dynamically -->
    </div>
  </div>
    <div id="historyList">
      <!-- Injected dynamically -->
    </div>
  </div>

  <!-- Dev Simulator Bar (For Browser / Dev Testing) -->
  <div id="devSimBar" class="dev-sim-bar" style="display: none;">
    <p id="simTitle" style="font-weight: 700; color: var(--text-secondary);"></p>
    <div id="simControls" class="dev-sim-controls"></div>
  </div>

  <!-- Application Logic JS -->
  <script type="module" src="app.js"></script>
</body>
</html>
