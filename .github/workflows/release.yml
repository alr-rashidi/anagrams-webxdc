name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="dev"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Using version: ${VERSION}"

      - name: Build one minified .xdc per locale
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          MAKE_XDC_PATH="$(pwd)/git-assets/make-xdc.sh"
          chmod +x "$MAKE_XDC_PATH"
          mkdir -p dist

          LOCALES_DIR=""
          for candidate in locales locals localization; do
            if [ -d "$candidate" ]; then
              LOCALES_DIR="$candidate"
              break
            fi
          done
          if [ -z "$LOCALES_DIR" ]; then
            echo "Error: No locales/locals/localization directory found!" >&2
            exit 1
          fi
          echo "Using locales directory: $LOCALES_DIR"

          LOCALE_FOUND=false
          for locale_dir in "$LOCALES_DIR"/*/; do
            [ -d "$locale_dir" ] || continue
            locale="$(basename "$locale_dir")"
            echo "=== Building minified package for locale: ${locale} ==="
            LOCALE_FOUND=true

            STAGE=".stage-$locale"
            rm -rf "$STAGE"
            mkdir -p "$STAGE"

            # Copy root files only (exclude locales, tools and temporary directories)
            find . -mindepth 1 -maxdepth 1 \
              ! -name ".git" \
              ! -name ".github" \
              ! -name "dist" \
              ! -name "temp" \
              ! -name "locales" \
              ! -name "locals" \
              ! -name "localization" \
              ! -name ".stage-*" \
              ! -name "node_modules" \
              ! -name "git-assets" \
              ! -name "build-dict.js" \
              -exec cp -a {} "$STAGE/" \;

            # Copy locale contents to the root of STAGE
            cp -a "$locale_dir"/. "$STAGE/"

            # Update version in manifest.toml
            if [ -f "$STAGE/manifest.toml" ]; then
              if grep -q '^version[[:space:]]*=' "$STAGE/manifest.toml"; then
                sed -i "s/^version[[:space:]]*=.*/version = \"${VERSION}\"/" "$STAGE/manifest.toml"
              else
                echo "version = \"${VERSION}\"" >> "$STAGE/manifest.toml"
              fi
            fi

            XDC_NAME="anagrams-${locale}-${VERSION}.xdc"
            DEST_XDC="$(pwd)/dist/${XDC_NAME}"

            # Copy the packaging script into STAGE so PROJECT_ROOT becomes STAGE
            cp "$MAKE_XDC_PATH" "$STAGE/make-xdc.sh"
            chmod +x "$STAGE/make-xdc.sh"

            (cd "$STAGE" && ./make-xdc.sh "$DEST_XDC" --minify --verbose)

            rm -rf "$STAGE"

            echo "=== Contents of dist/${XDC_NAME} ==="
            unzip -l "dist/${XDC_NAME}"
            test -s "dist/${XDC_NAME}"
          done

          if [ "$LOCALE_FOUND" = false ]; then
            echo "Error: '$LOCALES_DIR' found but contains no locale subdirectories!" >&2
            exit 1
          fi

          echo "=== Built .xdc files in dist/ ==="
          ls -la dist/

      - name: Upload .xdc files as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: xdc-files
          path: dist/*.xdc
          retention-days: 14
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.xdc
          generate_release_notes: true
