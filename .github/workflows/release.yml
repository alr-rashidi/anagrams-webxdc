name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="dev"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Using version: ${VERSION}"

      - name: Build .xdc per locale
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          mkdir -p dist
          chmod +x ./git-assets/make-xdc.sh

          LOCALE_FOUND=false

          LOCALES_DIR="locales"

          if [ -n "$LOCALES_DIR" ]; then
            for locale_dir in "$LOCALES_DIR"/*/; do
              [ -d "$locale_dir" ] || continue
              locale="$(basename "$locale_dir")"

              echo "=== Building package for locale: ${locale} ==="
              LOCALE_FOUND=true

              # Set version in the locale manifest if present
              if [ -f "$locale_dir/manifest.toml" ]; then
                if grep -q '^version[[:space:]]*=' "$locale_dir/manifest.toml"; then
                  sed -i "s/^version[[:space:]]*=.*/version = \"${VERSION}\"/" "$locale_dir/manifest.toml"
                else
                  echo "version = \"${VERSION}\"" >> "$locale_dir/manifest.toml"
                fi
              fi

              # Temporarily place all locale files next to the app files
              locale_files=("$locale_dir"/*)
              cp -r "$locale_dir"/. .

              XDC_NAME="nonograms-${locale}-${VERSION}.xdc"

              ./git-assets/make-xdc.sh "dist/${XDC_NAME}" --minify --verbose

              echo "=== Contents of dist/${XDC_NAME} ==="
              unzip -l "dist/${XDC_NAME}"
              test -s "dist/${XDC_NAME}"

              # Remove the temporary locale files from the root
              for f in "${locale_files[@]}"; do
                rm -rf "./$(basename "$f")"
              done
            done
          fi

          # Fail if no locales directory or locale subdirectories exist
          if [ "$LOCALE_FOUND" = false ]; then
            echo "Error: No 'locales' directory containing locale subdirectories was found!" >&2
            exit 1
          fi

          echo "=== Built .xdc files in dist/ ==="
          ls -la dist/

      - name: Upload .xdc files as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: xdc-files
          path: dist/*.xdc
          retention-days: 14
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.xdc
          generate_release_notes: true
